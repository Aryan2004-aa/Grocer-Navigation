<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Items | GroceryFinder</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="nav-left">
      <div class="logo" onclick="window.location.href='index1.html'" style="cursor:pointer;">🛒 GroceryFinder</div>
    </div>
    <nav class="nav-center">
      <a href="index1.html"><i class="fa fa-home"></i> Home</a>
      <a href="#"><i class="fa fa-history"></i> History</a>
      <a href="cart.html"><i class="fa fa-shopping-cart"></i> Cart</a>
    </nav>
  </header>

  <!-- Product Section -->
  <section class="stores">
    <h2>🛍️ Add Items to Your Cart</h2>
    <div class="store-list" id="productList"></div>
  </section>

  <footer>
    <div class="footer-bottom">© 2025 GroceryFinder. All rights reserved.</div>
  </footer>

  <script>
    const products = [
      { id: 1, name: "Apples (1kg)", price: 80, img: "https://cdn.pixabay.com/photo/2016/03/05/19/02/apple-1239422_1280.jpg" },
      { id: 2, name: "Bananas (1 dozen)", price: 50, img: "https://cdn.pixabay.com/photo/2018/03/07/19/20/bananas-3201369_1280.jpg" },
      { id: 3, name: "Milk (1L)", price: 60, img: "https://cdn.pixabay.com/photo/2016/03/05/22/15/milk-1238539_1280.jpg" },
      { id: 4, name: "Bread", price: 40, img: "https://cdn.pixabay.com/photo/2016/03/05/19/02/bread-1239420_1280.jpg" },
      { id: 5, name: "Rice (1kg)", price: 90, img: "https://cdn.pixabay.com/photo/2015/07/08/15/10/rice-835051_1280.jpg" },
      { id: 6, name: "Tomatoes (1kg)", price: 35, img: "https://cdn.pixabay.com/photo/2016/03/05/19/02/tomatoes-1239423_1280.jpg" },
      { id: 7, name: "Eggs (12pcs)", price: 75, img: "https://cdn.pixabay.com/photo/2016/03/05/19/02/eggs-1239424_1280.jpg" },
      { id: 8, name: "Cheese (200g)", price: 120, img: "https://cdn.pixabay.com/photo/2017/01/06/19/15/cheese-1956370_1280.jpg" }
    ];

    const productList = document.getElementById("productList");

    function renderProducts() {
      productList.innerHTML = products.map(
        (p) => `
        <div class="store-card">
          <img src="${p.img}" alt="${p.name}">
          <div class="store-info">
            <h4>${p.name}</h4>
            <p>💰 ₹${p.price}</p>
            <button onclick="addToCart(${p.id})">Add to Cart</button>
          </div>
        </div>
      `
      ).join("");
    }

    function addToCart(id) {
      const item = products.find(p => p.id === id);
      let cart = JSON.parse(localStorage.getItem("cart")) || [];
      cart.push(item);
      localStorage.setItem("cart", JSON.stringify(cart));
      alert(`${item.name} added to cart 🛒`);
    }

    renderProducts();
  </script>

</body>
</html>
